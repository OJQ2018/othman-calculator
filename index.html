<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Othman AI - ذكاء حقيقي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#0f0f1a;color:#fff;min-height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(90deg,#7c3aed,#f97316);padding:12px;text-align:center;font-weight:bold}
.setup{background:#1e1e30;margin:10px;padding:15px;border-radius:12px;border:1px dashed #7c3aed}
.setup input{width:100%;background:#0f0f1a;border:1px solid #3a3a5a;border-radius:8px;padding:10px;color:#fff;margin:8px 0}
.setup button{background:#7c3aed;color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;width:100%;font-weight:bold}
.chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px;padding-bottom:110px}
.msg{max-width:88%;padding:12px 16px;border-radius:20px;line-height:1.7;white-space:pre-wrap}
.bot{background:#1e1e30;align-self:flex-start;border-bottom-right-radius:6px}
.user{background:linear-gradient(90deg,#7c3aed,#a78bfa);align-self:flex-end;border-bottom-left-radius:6px}
.inputBar{position:fixed;bottom:0;left:0;right:0;background:#1a1a2e;padding:12px;display:flex;gap:10px;align-items:center;border-top:1px solid #2a2a4a}
.inputBar input{flex:1;background:#0f0f1a;border:1px solid #3a3a5a;border-radius:25px;padding:12px 18px;color:#fff;outline:none}
.btn{width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px}
.send{background:linear-gradient(135deg,#7c3aed,#f97316);color:#fff}
.mic{background:#2a2a4a;color:#fff}
.mic.recording{background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.speaker{font-size:14px;cursor:pointer;opacity:.8;margin-right:6px}
a{color:#a78bfa}
</style>
</head>
<body>
<div class="header">Othman AI - ذكاء حقيقي</div>
<div class="setup" id="setupBox">
<b>🔑 الصق مفتاح Gemini هنا (مرة واحدة فقط):</b>
<input type="password" id="apiKeyInput" placeholder="AIza...">
<button onclick="saveKey()">💾 احفظ وشغّل</button>
<div style="font-size:11px;opacity:.6;margin-top:6px">جيبه من: aistudio.google.com/app/apikey</div>
</div>
<div class="chat" id="chat"></div>
<div class="inputBar">
<button class="btn mic" id="micBtn">🎤</button>
<input type="text" id="input" placeholder="احجي أي شي...">
<button class="btn send" id="sendBtn">➤</button>
</div>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('input');
const setupBox=document.getElementById('setupBox');
const apiKeyInput=document.getElementById('apiKeyInput');
let API_KEY=localStorage.getItem('OTHMAN_GEMINI_KEY')||'';
if(API_KEY){ apiKeyInput.value=API_KEY; setupBox.style.display='none'; addInitial(); } else { showInitialBeforeKey(); }
function showInitialBeforeKey(){
  const div=document.createElement('div'); div.className='msg bot';
  div.textContent='هلا عثمان! حط المفتاح فوق حتى أصير ذكي حقيقي وأفهم أي كلمة.'; chat.appendChild(div);
}
function addInitial(){
  const div=document.createElement('div'); div.className='msg bot';
  div.textContent='تم! الآن أنا ذكاء حقيقي 🧠 احجيلي "مرحبا كيفك شو الأخبار شكو ماكو"'; chat.appendChild(div);
}
function saveKey(){
  const k=apiKeyInput.value.trim();
  if(k.length<20){alert('تأكد نسخت المفتاح كامل');return;}
  localStorage.setItem('OTHMAN_GEMINI_KEY',k); API_KEY=k; setupBox.style.display='none'; chat.innerHTML=''; addInitial();
}
let voices=[]; function loadVoices(){voices=speechSynthesis.getVoices();} speechSynthesis.onvoiceschanged=loadVoices; loadVoices();
function speak(text){ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); const ar=voices.find(v=>v.lang.includes('ar'))||voices[0]; if(ar) u.voice=ar; u.lang='ar-SA'; u.rate=0.95; speechSynthesis.speak(u); }
function addMsg(text,who){
  const div=document.createElement('div'); div.className='msg '+who; div.textContent=text;
  if(who==='bot'){ const sp=document.createElement('span'); sp.textContent=' 🔊'; sp.className='speaker'; sp.onclick=()=>speak(text); div.appendChild(sp); }
  chat.appendChild(div); chat.scrollTop=chat.scrollHeight; if(who==='bot') speak(text);
}
async function askGemini(prompt){
  if(!API_KEY) return 'حط المفتاح فوق أولاً!';
  // جرب موديلات جديدة بالترتيب
  const models=['gemini-2.0-flash','gemini-1.5-flash-latest','gemini-1.5-flash-8b-latest','gemini-pro'];
  const system=`أنت Othman AI صنعه عثمان. احجي بنفس لهجة المستخدم (عراقي، مصري، سوري، خليجي). جاوب باختصار (2-3 أسطر) بلهجة عراقية إذا المستخدم عراقي. لا تكرر. المستخدم قال: `;
  for(let model of models){
    try{
      const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${API_KEY}`;
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:system+prompt}]}]})});
      const data=await r.json();
      if(data.candidates && data.candidates[0]?.content?.parts?.[0]?.text){
        return data.candidates[0].content.parts[0].text;
      }
      if(data.error && !data.error.message.includes('not found')){
        return 'خطأ: '+data.error.message;
      }
    }catch(e){ continue; }
  }
  return 'ما قدرت اتصل، تأكد المفتاح صحيح وفعلت Gemini API من الرابط.';
}
async function handleSend(){
  const text=input.value.trim(); if(!text) return;
  addMsg(text,'user'); input.value='';
  const typing=document.createElement('div'); typing.className='msg bot'; typing.textContent='يفكر... 🧠'; chat.appendChild(typing); chat.scrollTop=chat.scrollHeight;
  const reply=await askGemini(text);
  typing.remove(); addMsg(reply,'bot');
}
document.getElementById('sendBtn').onclick=handleSend;
input.onkeypress=e=>{if(e.key==='Enter') handleSend();};
let rec; if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; rec=new SR(); rec.lang='ar-IQ';
  rec.onstart=()=>document.getElementById('micBtn').classList.add('recording');
  rec.onend=()=>document.getElementById('micBtn').classList.remove('recording');
  rec.onresult=e=>{ input.value=e.results[0][0].transcript; handleSend(); };
}
document.getElementById('micBtn').onclick=()=>{ if(!rec){alert('استخدم كروم');return;} try{rec.start();}catch{rec.stop();} };
</script>
</body>
</html>
