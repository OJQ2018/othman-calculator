<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Othman AI - صوت + ذكاء</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;color:#fff;font-family:'Segoe UI',Tahoma;height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(90deg,#7c3aed,#ff9a3c);padding:14px;text-align:center}
#chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#0f0f1e}
.msg{max-width:85%;padding:11px 15px;border-radius:18px;line-height:1.7;font-size:14.5px;white-space:pre-wrap;position:relative}
.user{align-self:flex-start;background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.ai{align-self:flex-end;background:#1c2233;border:1px solid #2a344e}
.msg .spk{cursor:pointer;margin-right:8px}
.typing{align-self:flex-end;background:#1c2233;border-radius:18px;padding:8px 15px;font-size:12px;opacity:.7}
#box{display:flex;gap:8px;padding:12px;background:#0a0a14;border-top:1px solid #1e293b;align-items:center}
#inp{flex:1;padding:13px 18px;border-radius:26px;border:1px solid #2a344e;background:#1c2233;color:#fff;outline:none}
#btn,#mic{border:0;color:#fff;width:48px;height:48px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0}
#btn{background:linear-gradient(135deg,#7c3aed,#ff9a3c)}
#mic{background:#1c2233;border:1px solid #2a344e}
#mic.listening{background:#ff3b3b;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
</style>
</head>
<body>
<header><h2>Othman AI 🔊 صوت + ذكاء</h2><p>احجي بلهجتك - يفهم عراقي مصري سوري</p></header>
<div id="chat"><div class="msg ai">هلا والله! رجع الصوت 🔊 اضغط المايك 🎤 واحجي "شدتسوي" أو "احجيلي نكته" وأنا أرد عليك كتابة وصوت.</div></div>
<div id="box"><button id="mic">🎤</button><input id="inp" placeholder="اكتب أو تكلم..."><button id="btn">➤</button></div>
<script>
const chat=document.getElementById('chat'), inp=document.getElementById('inp'), btn=document.getElementById('btn'), mic=document.getElementById('mic');
function add(t,c){
 let d=document.createElement('div');d.className='msg '+c;
 if(c==='ai'){
   d.innerHTML = t.replace(/</g,'&lt;') + ' <span class="spk" onclick="speak(\''+t.replace(/'/g,"\'").substring(0,150)+'\')">🔊</span>';
 }else d.textContent=t;
 chat.appendChild(d);chat.scrollTop=9999;
 if(c==='ai') speak(t);
}
function speak(text){
 if(!('speechSynthesis' in window)) return;
 speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(text.substring(0,250));
 u.lang='ar-SA'; u.rate=0.95;
 let voices=speechSynthesis.getVoices();
 let ar=voices.find(v=>v.lang.includes('ar'));
 if(ar) u.voice=ar;
 speechSynthesis.speak(u);
}
function addTyping(){let d=document.createElement('div');d.className='typing';d.id='typing';d.textContent='يكتب...';chat.appendChild(d);chat.scrollTop=9999;}
function removeTyping(){let e=document.getElementById('typing');if(e) e.remove();}
async function getAI(userText){
 let system = `أنت Othman AI، صديق عراقي ذكي جدا، تفهم كل اللهجات: عراقي (شدتسوي شلونك شكو ماكو عاشت ايدك)، مصري (ازيك عامل ايه)، سوري (شو عم تعمل كيفك)، خليجي (وش تسوي). رد بنفس لهجة المستخدم، إذا طلب نكته احكي نكته بلهجته، ردودك جميلة منطقية، لا تقل فهمتك أبدا، اسمك Othman AI صنعك Othman.`;
 try{
  let res = await fetch('https://text.pollinations.ai/openai', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({model:'openai', messages:[{role:'system', content:system},{role:'user', content:userText}]})
  });
  if(res.ok){
    let data=await res.json();
    if(data.choices) return data.choices[0].message.content;
  }
 }catch(e){}
 // fallback smart
 let t=userText.toLowerCase();
 if(t.includes('نكته')||t.includes('نكتة')) return 'واحد عراقي راح للدكتور كاله أنسى هواي، كاله شوكت هاي الحالة؟ كاله يا حالة؟ 😂';
 if(t.includes('شدتسوي')||t.includes('شتسوي')) return 'كاعد هنا وياك أسمعك، أنت شدتسوي يا ذهب؟';
 if(t.includes('حلو')||t.includes('عاشت ايدك')) return 'تسلم يا غالي، هذا من ذوقك والله، أنت الأحلى.';
 if(t.includes('شلونك')) return 'أنا زين الحمدلله، أنت شلونك؟ طمني.';
 if(t.includes('ازيك')||t.includes('عامل ايه')) return 'أنا زي الفل، أنت عامل ايه يا باشا؟';
 if(t.includes('شو عم تعمل')) return 'قاعد هون معك، عم استناك تحكيلي، أنت شو عم تعمل؟';
 return 'حبيبي فهمت عليك، كمل احجيلي.';
}
async function send(){
 let v=inp.value.trim(); if(!v) return;
 add(v,'user'); inp.value='';
 addTyping();
 let reply=await getAI(v);
 removeTyping();
 add(reply,'ai');
}
btn.onclick=send;
inp.onkeydown=e=>{if(e.key==='Enter') send();};
let rec;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 rec=new SR(); rec.lang='ar-SA'; rec.interimResults=false;
 rec.onstart=()=>mic.classList.add('listening');
 rec.onend=()=>mic.classList.remove('listening');
 rec.onresult=e=>{inp.value=e.results[0][0].transcript; send();};
 mic.onclick=()=>{ try{rec.start();}catch{rec.stop();} };
}
</script>
</body>
</html>
